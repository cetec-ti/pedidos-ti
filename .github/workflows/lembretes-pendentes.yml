name: Lembretes de Solicitações Pendentes

on:
  schedule:
    # Horários em UTC. Brasil (BRT = UTC-3, sem horário de verão) 8h/11h/14h/17h.
    - cron: '0 11,14,17,20 * * *'
  workflow_dispatch: {} # permite disparar manualmente pela aba Actions, para testes

jobs:
  lembrar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts/lembretes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/lembretes/package-lock.json

      - run: npm install

      - run: node enviar.js
