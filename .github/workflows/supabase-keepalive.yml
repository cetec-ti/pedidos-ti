name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 */4 * *'  # A cada 4 dias, às 08h UTC
  workflow_dispatch:        # Permite rodar manualmente pelo GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase — pedidos-ti
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://lkivpaalalcqxctqhpip.supabase.co/rest/v1/colaboradores?select=id&limit=1" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxraXZwYWFsYWxjcXhjdHFocGlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMzYzMDIsImV4cCI6MjA5NDcxMjMwMn0.uqfAlC1jnOxMRJoTj1Rczy_MnQcER8C8OaiW0-puk8s" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxraXZwYWFsYWxjcXhjdHFocGlwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkxMzYzMDIsImV4cCI6MjA5NDcxMjMwMn0.uqfAlC1jnOxMRJoTj1Rczy_MnQcER8C8OaiW0-puk8s")
          echo "Status HTTP: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            echo "✅ Supabase respondendo normalmente."
          else
            echo "⚠️ Resposta inesperada: $STATUS"
            exit 1
          fi
